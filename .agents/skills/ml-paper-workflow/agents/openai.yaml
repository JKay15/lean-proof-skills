interface:
  display_name: "ML Paper Workflow"
  short_description: "Strict Intake v2 + Lean proof workflow with hard gates"
  default_prompt: "Use $ml-paper-workflow to run Intake v2 two-phase commit for new problems (Research Pack -> Lean Commit), enforce Planner(GPTPro) batch replan + Builder(Codex) execution on stuck cards, then execute Snapshot -> Retrieval -> Screening -> Minimal Patch -> Gate -> Artifact update via $lean4."

dependencies:
  tools:
    - type: "mcp"
      value: "lean-lsp-mcp"
      description: "Lean LSP MCP server"

policy:
  allow_implicit_invocation: false
